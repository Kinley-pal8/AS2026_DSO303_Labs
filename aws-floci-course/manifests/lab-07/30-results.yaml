apiVersion: v1
kind: ConfigMap
metadata:
  name: usms-results-conf
  namespace: usms
  labels:
    app: usms-results
data:
  default.conf.template: |
    server {
      listen 80;
      server_name _;

      location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
      }

      location / {
        add_header Content-Type application/json;
        return 200 '{"service":"usms-results","pod":"${POD_NAME}","campus":"${APP_CAMPUS}","version":"${APP_VERSION}"}\n';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usms-results
  namespace: usms
  labels:
    app: usms-results
    project: usms
    tier: app
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: usms-results
  template:
    metadata:
      labels:
        app: usms-results
        project: usms
        tier: app
    spec:
      containers:
        - name: results
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: usms-app-config
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/templates
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: conf
          configMap:
            name: usms-results-conf
---
apiVersion: v1
kind: Service
metadata:
  name: usms-results
  namespace: usms
  labels:
    app: usms-results
spec:
  type: ClusterIP
  selector:
    app: usms-results
  ports:
    - name: http
      port: 80
      targetPort: http
