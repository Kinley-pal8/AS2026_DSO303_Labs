apiVersion: v1
kind: ConfigMap
metadata:
  name: usms-gateway-conf
  namespace: usms
  labels:
    app: usms-gateway
data:
  default.conf.template: |
    server {
      listen 80;
      server_name _;

      location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
      }

      location = / {
        add_header Content-Type application/json;
        return 200 '{"service":"usms-gateway","pod":"${POD_NAME}","routes":["/enrolment/","/results/","/timetable/"]}\n';
      }

      location /enrolment/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://usms-enrolment.usms.svc.cluster.local/;
      }

      location /results/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://usms-results.usms.svc.cluster.local/;
      }

      location /timetable/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://usms-timetable.usms.svc.cluster.local/;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usms-gateway
  namespace: usms
  labels:
    app: usms-gateway
    project: usms
    tier: web
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: usms-gateway
  template:
    metadata:
      labels:
        app: usms-gateway
        project: usms
        tier: web
    spec:
      containers:
        - name: gateway
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: usms-app-config
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/templates
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: conf
          configMap:
            name: usms-gateway-conf
---
apiVersion: v1
kind: Service
metadata:
  name: usms-gateway
  namespace: usms
  labels:
    app: usms-gateway
spec:
  type: ClusterIP
  selector:
    app: usms-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
